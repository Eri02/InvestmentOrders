version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: investmentorders_api
    ports:
      - "5000:8080"
    environment:
      - ApiKey=super-secret-key
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=InvestmentOrdersDb;User=sa;Password=Your_password123;TrustServerCertificate=True
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data:
